<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rosterm8</title>
<meta name="description" content="Build a fair staff roster in seconds. Works offline, on your phone.">

<!-- Installable web app: these make "Add to Home Screen" behave like a real app. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f5f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rosterm8">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Header: wordmark + which organisation you're working on -->
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <span class="brand-tile" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span class="brand-name">ROSTERM8</span>
    </div>
    <div class="org-switch">
      <select id="org-select" aria-label="Organisation"></select>
    </div>
  </div>
</header>

<!-- Each view renders into this element; only one is shown at a time. -->
<main id="view" class="view" tabindex="-1"></main>

<!-- Bottom navigation: thumb-reachable on a phone, a top row on wide screens. -->
<nav class="tabbar" aria-label="Sections">
  <button class="tab" data-view="roster" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Roster</span>
  </button>
  <button class="tab" data-view="people">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 11.2A3 3 0 0 0 16 5.3"/><path d="M18.5 20c0-2.5-1-4.2-2.6-5.1"/></svg>
    <span>People</span>
  </button>
  <button class="tab" data-view="shifts">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
    <span>Shifts</span>
  </button>
  <button class="tab" data-view="saved">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
    <span>Saved</span>
  </button>
  <button class="tab" data-view="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9L5.3 5.3"/></svg>
    <span>Settings</span>
  </button>
</nav>

<!-- Transient confirmation messages -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Generic dialog host, filled by ui.js -->
<dialog id="modal" class="modal"></dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
